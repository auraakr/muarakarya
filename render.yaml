databases:
  - name: muarakarya-db
    databaseName: muarakarya
    user: muarakarya
    plan: free

services:
  - type: web
    name: muarakarya
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: CV. Muara Karya
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://muarakarya.onrender.com  # ganti dengan URL asli setelah deploy
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: muarakarya-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: muarakarya-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: muarakarya-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: muarakarya-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: muarakarya-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
